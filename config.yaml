# Narrador_IA - configuracion
# Rutas relativas (voices/...) son relativas a esta carpeta (Narrador_IA/).

# Ruta completa al archivo .plugindata si el autodetectado falla.
# Ejemplo: "C:\\Users\\shars\\OneDrive\\Documentos\\The Lord of the Rings Online\\PluginData\\sharshazo\\AllServers\\LOTRO_Narrator_Feed.plugindata"
plugindata_path: null

poll_interval_seconds: 0.04  # cada cuanto se revisa si hay chat/pedido/SFX nuevo (bajado de 0.3->0.15 el 2026-09-02, y de 0.15->0.04 el 2026-09-03: pedido explicito de que los SFX de abrir ventana/cambiar pestaña se sientan instantaneos -- el costo real de revisar 4 archivos chicos 25 veces por segundo en vez de 6-7 es insignificante para la CPU)
max_chars: 400                # mensajes mas largos que esto se ignoran (evita leer bloques enteros)
dedupe_window_seconds: 6      # ignora una linea identica repetida dentro de esta ventana
max_queue_depth: 8            # si se acumulan mas lineas sin leer que esto, se descartan las mas viejas

# Carpeta accesoria de audio (relativa a esta carpeta), usada solo si
# cache_enabled: true.
cache_dir: "VoiceOverData/cache"

# 2026-09-02 (pedido explicito del usuario): "sin cache, nada se guarda" --
# el cache real llego a pesar 15GB con solo 4765 de 14824 misiones
# generadas, SIN ningun tope que lo frenara.
#
# 2026-09-03 (pedido explicito del usuario: "que sea instantaneo si es
# posible" -- medido en esta sesion: una sintesis NUEVA de edge-tts tiene un
# piso de red de ~0.7-1.3s antes del primer byte de audio, sea cual sea el
# largo del texto -- no bajable desde el codigo sin evitar la llamada de red
# por completo para esa linea puntual). Reactivado, esta vez CON TOPE
# (cache_max_mb): al pasarse del limite se borra lo usado hace MAS TIEMPO
# primero (LRU real, ver VoiceCache.enforce_limit()) -- nunca vuelve a
# crecer sin control como la vez pasada. Una linea narrada una vez sale
# INSTANTANEA la proxima vez que se repite (misma mision con otro
# personaje, misiones diarias, volver a una zona), a costa de hasta
# cache_max_mb de disco.
#
# 2026-09-05 (pedido explicito del usuario: "por lo general siempre
# tenemos activa comunmente 5 misiones... podriamos hacer este guardado
# mas pequeño"): 300MB nunca se eligio contra un uso real medido -- el
# cache real de esta cuenta, tras varios dias de juego (106 archivos),
# pesa 2.6MB, el archivo mas pesado 49KB. A ese tamaño real, 300MB
# alcanzaria para mas de 10.000 lineas narradas antes de que
# enforce_limit() borre la primera -- muchisimo mas margen del que hace
# falta para "5 misiones activas" mas el chat de una sesion de juego.
# Bajado a un numero que sigue cubriendo con margen de sobra varias
# sesiones completas (30MB / ~30KB promedio real ~= 1000 lineas) sin
# reservar espacio de mas. El mecanismo de auto-borrado (LRU, mas viejo
# primero) YA corria automaticamente antes de este cambio -- esto solo
# ajusta el numero, no el comportamiento.
cache_enabled: true
cache_max_mb: 30

# Efectos de sonido cortos (fanfarria al aceptar/completar mision, ding de
# progreso, pergamino al abrir/cerrar, click de fila -- ver
# NarratorBridge.lua:SignalSfx, src/sfx.py). Independiente de la narracion:
# son archivos de audio ya generados en voices/sfx/ (ver tools/gen_sfx.py),
# no texto sintetizado. sfx_enabled: false los apaga a todos sin tocar nada
# mas.
sfx_enabled: true
sfx_dir: "voices/sfx"

# Narracion de introduccion (pedido explicito del usuario, 2026-09-05): un
# audio FIJO, pre-generado una sola vez con la voz "narrador_intro" (ver
# tools/build_intro_narration.py, voices/intro/intro_bienvenida.wav) que se
# reproduce automaticamente UNA VEZ por cada apertura de LOTRO -- se logra
# gratis porque watcher.py ya lanza un proceso narrator.py nuevo por cada
# apertura del juego y lo mata al cerrarlo (ver Narrator.play_intro en
# src/narrator.py). intro_enabled: false apaga el disparo automatico sin
# tocar nada mas; el boton "Reproducir introduccion" de la bandeja siempre
# funciona, sea cual sea este valor (pensado para poder probarla a mano).
intro_enabled: true
intro_delay_seconds: 7  # espera tras detectar LOTRO antes de narrar, para dejar cargar el juego

# Narracion ambiental aleatoria MIENTRAS SE JUEGA (2026-09-05, pedido
# explicito del usuario): historias/leyendas/consejos que el narrador dice
# solo, cada tanto -- SIN musica (para no competir con el audio del juego
# en partidas largas), solo con los graves realzados (ver
# audio_fx.apply_narrator_fx). Prioridad MAS BAJA de las 3 colas del
# narrador (ver tts.py:play_ambient): un click en "Narrar" para una mision
# la corta al instante, y el temporizador de la proxima sigue su curso
# aparte, sin verse afectado. ambient_enabled: false la apaga sin tocar
# nada mas. min/max: rango en segundos entre un episodio y el siguiente
# (se elige un valor al azar dentro de ese rango cada vez).
ambient_enabled: true
ambient_min_interval_seconds: 480   # 8 minutos
ambient_max_interval_seconds: 900   # 15 minutos

# Que canales narrar y con que voz. Los nombres de voz deben existir en "voices:" mas abajo.
# 2026-09-02 (pedido explicito del usuario): TODOS desactivados -- solo se
# quiere narracion de misiones (aceptar/progreso/completar, ver
# Core/NarratorBridge.lua), no el chat ambiental que reenvia
# LOTRO_Chat_Narrator. El addon LOTRO_Chat_Narrator puede seguir instalado
# sin problema -- sigue reenviando el feed, pero Narrador_IA no narra nada
# de el con todos los canales en false. Reactivar cualquiera de estos
# devuelve el chat ambiental sin tocar nada mas.
channels:
  Quest:
    enabled: false
    voice: edge_alvaro
  Say:
    enabled: false
    voice: edge_elvira
  Emote:
    enabled: false
    voice: edge_elvira
  Tell:
    enabled: false
    voice: edge_elvira
  Fellowship:
    enabled: false
    voice: edge_elvira
  Kinship:
    enabled: false
    voice: edge_elvira
  Raid:
    enabled: false
    voice: edge_elvira
  Death:
    enabled: false
    voice: edge_alvaro
  Loot:
    enabled: false
    voice: edge_alvaro
  Advancement:
    enabled: false
    voice: edge_alvaro

# Voces disponibles (ver src/engines/). Piper (offline) se elimino a
# proposito (2026-09-02, pedido explicito del usuario): LOTRO es un MMO
# online, si no hay internet el juego mismo se desconecta, asi que un motor
# de respaldo "sin internet" no tenia caso de uso real. Si un motor falla
# por otro motivo, se cae a una voz edge-tts fija (ver FALLBACK_VOICE_NAME
# en src/tts.py) en vez de quedar en silencio.
#
# - engine: edge   -> gratis, sin API key, requiere internet (servicio de
#   lectura en voz alta de Microsoft Edge). "rate"/"volume_pct"/"pitch" son
#   strings tipo "+10%"/"-20%"/"+5Hz".
# - engine: xtts   -> clonacion de voz LOCAL y gratuita (sin API key), a
#   partir de un clip de referencia en "clone_ref" (ver voices/reference/).
#   Requiere instalar el paquete opcional `coqui-tts` (ver README, ~2GB de
#   modelo la primera vez). Pensada para personajes principales.
voices:
  edge_alvaro:
    engine: edge
    voice_id: es-ES-AlvaroNeural
  edge_elvira:
    engine: edge
    voice_id: es-ES-ElviraNeural
