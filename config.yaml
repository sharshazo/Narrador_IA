# Override para PERSONAJES PRINCIPALES: nombre de NPC en minusculas -> nombre
# de una voz declarada arriba en "voices". Se revisa antes que el hash de
# npc_voice_pool.
#
# 2026-09-02: curado con los nombres EXACTOS de bestower que aparecen en
# Data/QuestDatabase_*.lua (verificado con grep, no adivinado) para los
# personajes legendarios de LOTRO. IMPORTANTE -- esto NO es clonacion de voz
# real, es una asignacion FIJA (no aleatoria por hash) elegida a mano por
# arquetipo entre las 11 voces gratis ya disponibles: mas consistente que el
# hash generico, pero no "identica" a la voz real del personaje. Para eso
# hace falta un clip de referencia por personaje y una voz "engine: xtts"
# (ver voices/reference/README.md) -- con solo 11 voces stock, varios
# personajes comparten voz a proposito por parecido de arquetipo (ambos
# magos ancianos, ambos enanos, etc.), documentado abajo.
main_npcs:
  # 2026-09-02 (pedido explicito del usuario, tras ampliar el pool a 45
  # voces edge-tts): antes solo habia 11 voces en total y varios personajes
  # compartian por falta de opciones -- ahora CADA personaje legendario
  # tiene su propia voz, sin repetir ninguna entre si. Elegidas por
  # arquetipo (genero + tono narrativo esperado), NO por haber escuchado la
  # voz real de cada personaje -- ver audición mandada al usuario para que
  # confirme/ajuste cada una de oido.
  gandalf: gandalf_clone
  radagast: edge_gt_andres
  radagast the brown: edge_gt_andres
  tom bombadil: edge_co_gonzalo
  aragorn: edge_alvaro
  king aragorn ii elessar: edge_alvaro
  strider: edge_alvaro
  merry: edge_pa_roberto
  legolas: edge_ec_luis
  elladan: edge_hn_carlos
  elrohir: edge_pe_alex
  glorfindel: edge_cr_juan
  thranduil: edge_ve_sebastian
  king thranduil: edge_ve_sebastian
  pippin: edge_do_emilio
  elrond: edge_gq_javier
  galadriel: edge_es_ximena
  arwen: edge_cl_catalina
  gimli: edge_cu_manuel
  thorin oakenshield: edge_uy_mateo
  king thorin iii: edge_cl_lorenzo
  frodo baggins: edge_sv_rodrigo
  boromir: edge_jorge
  samwise gamgee: edge_py_mario
  "samwise gamgee - loyal attendant": edge_py_mario
  bilbo baggins: edge_tomas

