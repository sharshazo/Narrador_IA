  # Sigue usandose para el NPC "gandalf" en el chat ambiental (ver
  # main_npcs mas abajo) -- NO tocar, es el sistema de misiones existente.
  gandalf_clone:
    engine: xtts
    clone_ref: voices/reference/gandalf.mp3

  # Voz de la narracion de INTRODUCCION (2026-09-05). Historial de prueba y
  # error explicito del usuario, de peor a mejor resultado:
  #   1) gandalf_clone (XTTS): "esta demasiado malo, tiene mucho ruido" --
  #      clonar desde un clip corto (~10s) arrastra ruido de fondo del clip
  #      en cada fragmento nuevo, notorio en una pieza de 2-3 minutos.
  #   2) edge-tts/es-ES-AlvaroNeural con pitch/rate bajados: limpio, pero
